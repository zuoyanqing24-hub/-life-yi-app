// ---- core.js ----
/* Pure data rules, shared by the app and regression checks. */
(function(root){
  const duo=typeof module!=='undefined'&&module.exports?require('./duo-core.js'):root.YijingDuoCore;
  function randomIndex(current,count,rng=Math.random){
    if(count<=1)return 0;
    const slot=Math.min(count-2,Math.max(0,Math.floor(rng()*(count-1))));
    return slot>=current?slot+1:slot;
  }
  function normalizeRecords(value){
    if(!Array.isArray(value))return [];
    const seen=new Set(),result=[];
    for(const r of value){
      if(!r||typeof r!=='object'||typeof r.id!=='string'||!r.id||r.id.length>100||seen.has(r.id))continue;
      if(r.kind==='duo'){
        const valid=duo.normalizeRecord(r);if(valid){seen.add(r.id);result.push(valid);}continue;
      }
      if(!['help','delay','change','chance','difference'].includes(r.eventId))continue;
      seen.add(r.id);result.push({
        id:r.id,createdAt:typeof r.createdAt==='string'&&!Number.isNaN(Date.parse(r.createdAt))?r.createdAt:null,
        updatedAt:typeof r.updatedAt==='string'?r.updatedAt:null,
        scenario:['学习考试','感情人际','出行安排','求职工作','其他问题','日常生活'].includes(r.scenario)?r.scenario:'日常生活',
        hexagramId:'xiaoxu',hexagramName:'风天小畜',eventId:r.eventId,
        thought:typeof r.thought==='string'?r.thought.slice(0,500):'',favorite:r.favorite===true,
        source:'simulated',...(typeof r.legacyDate==='string'?{legacyDate:r.legacyDate}:{}),saved:r.saved!==false
      });
    }
    return result;
  }
  function migrateLegacy(value){
    if(!Array.isArray(value))return [];
    const titles=['意外助力','计划延误','条件突变','临时机会','意见分歧'];
    const ids=['help','delay','change','chance','difference'];
    return normalizeRecords(value.filter(r=>r&&typeof r==='object').map((r,i)=>({id:'legacy-'+i,createdAt:null,legacyDate:typeof r.date==='string'?r.date:'',scenario:r.ctx,eventId:ids[Math.max(0,titles.indexOf(r.event))],thought:'',favorite:false,saved:true})));
  }
  const api=Object.freeze({randomIndex,normalizeRecords,migrateLegacy});
  if(typeof module!=='undefined'&&module.exports)module.exports=api;
  else root.YijingCore=api;
})(globalThis);

    return `<section class="duo-choice-section" data-letter="${field}">${heading}<p>${hint}</p><div class="duo-options" role="group" aria-label="${title}">${t.options.map(o=>`<button data-act="duo:choose" data-arg="${field}:${o.id}" aria-pressed="${answer[field]===o.id}" ${busy?'disabled':''}><span>${o.label}</span><i>${icon('check')}</i></button>`).join('')}</div><div class="duo-free-note"><label for="${id}">自由填写 <small>也可补充选项</small></label><textarea id="${id}" data-duo-field="${field}Text" maxlength="${C.MAX_TEXT}" rows="2" ${busy?'disabled':''} aria-describedby="${id}-hint" placeholder="${field==='self'?'也可以写下你最在意的事，或补充原因……':'你觉得对方在意什么？为什么这样想……'}">${html(value)}</textarea><div class="duo-free-meta"><small id="${id}-hint">没有合适选项，也可以只填写文字</small><span data-count="${field}">${value.length}/${C.MAX_TEXT}</span></div>${answer[field]?`<button class="duo-clear-choice" data-act="duo:clear" data-arg="${field}" ${busy?'disabled':''}>取消选项，改用自由填写</button>`:''}</div><button class="duo-seal-button" data-act="duo:seal" data-arg="${field}" ${busy||!C.fieldComplete(draft.topicId,answer,field)?'disabled':''}><span class="duo-mini-envelope" aria-hidden="true"></span><span>折起信纸，装入信封</span>${icon('next')}</button><small class="duo-letter-tip">封好后，本轮不再修改这一页</small></section>`;
  }
  function form(person){const other=person==='a'?'乙':'甲',allSealed=draft.sealed[person].self&&draft.sealed[person].guess;return shell(`${progress(person==='a'?0:1)}<div class="duo-content"><div class="duo-turn"><span>${who(person)}</span><div><h2>现在轮到${who(person)}独立填写</h2><p>${person==='b'?'甲的信已封好，页面不会显示答案。':'填写时，请让另一位暂时移开视线。'}</p></div></div><div class="duo-event-note">${html(draft.event||C.topic(draft.topicId).question)}</div>${choiceGroup(person,'self','我最在意什么？','选一个方向，也可以在下方写下自己的想法。')}${choiceGroup(person,'guess',`我猜${other}最在意什么？`,'凭你的理解选择或填写，翻卡前不会看到对方的答案。')}${actionButton(person==='a'?'两页已封好，交给乙':'两页已封好，一起摇卦','duo:submit',{disabled:!allSealed||!!draft.sealing})}<p class="quiet">${allSealed?'信已封好，下一步再听见彼此。':'请分别把两页心意笺装入信封。'}</p></div>`);}
  function handoff(){return shell(`${progress(1)}<section class="duo-content duo-handoff"><div class="duo-handoff-post">${envelope('甲',true)}<span>甲 · 两页心意已封存</span></div><span class="eyebrow">把心意暂时收好</span><h2>把手机交给乙</h2><p>甲的答案已从页面隐藏。<br>请乙独立填写，先保留自己的想法。</p>${actionButton('我是乙，开始填写','duo:second',{arrow:true})}</section>`);}
  function castProgress(){return `<ol id="duoCastProgress" class="cast-progress duo-cast-progress" aria-label="六次轻触进度">${['第一爻','第二爻','第三爻','第四爻','第五爻','第六爻'].map((label,i)=>`<li class="${i<draft.castCount?'done':''}" ${i===draft.castCount?'aria-current="step"':''}><span></span><small>${label}</small></li>`).join('')}</ol>`;}
  function casting(){return `<div class="native-page duo-page duo-cast-page ${draft.castBusy?'is-casting':''}" data-duo-stage="ready" data-draw-phase="${draft.drawPhase}" data-cast-count="${draft.castCount}">${statusBar()}${topBar('双人摇卦',`<button class="skip-button duo-cast-skip" data-act="duo:skip-cast" ${draft.castBusy?'disabled':''}>跳过</button>`)}<p class="duo-cast-subtitle">放下预设，一起听见彼此的心意</p><div class="duo-cast-art"><img src="${assetURL(`assets/duo/duo-cast-lake-v1.webp`)}" class="duo-cast-landscape" alt="青瓷色雾中水面、低缓远山与相向的双手">${layer('petal.png','duo-cast-petal')}</div><section class="duo-cast-instruction"><h2>${draft.castCount?'心意相合，卦意渐成…':'为彼此，轻摇六次'}</h2><p>把手机放在两人都能看到的位置，轻触下方摇动</p><small class="duo-cast-event">${html(draft.event||C.topic(draft.topicId).question)}</small></section>${castProgress()}<button class="cast-button duo-cast-button" data-act="duo:draw" ${draft.castBusy?'disabled':''} aria-label="轻触摇动，已完成${draft.castCount}次，共6次">${layer('cast-orb.webp','','轻触摇动')}<span>${draft.castBusy?'心意轻摇中…':'轻触摇动'}</span></button><p class="duo-cast-status" role="status">${draft.castCount?'已完成 '+draft.castCount+' / 6 次':'甲的信已封存 · 乙的信已封存'}</p><p class="duo-cast-boundary quiet">六次轻触完成文化演示，随机呈现一张卦意卡</p></div>`;}
  function ready(){const phase=draft.drawPhase||'idle';if(!['drawn','flipping'].includes(phase))return casting();return shell(`${progress(2)}<section class="duo-content duo-ready"><span class="eyebrow">四页心意，都已封好</span><h2>卦意已成，一起读信。</h2><p>翻开这次的卦意卡，<br>再一起看看不同的想法。</p><div class="duo-sealed-pair"><span>${envelope('甲',true)}<small>甲的信 · 已封存</small></span><span>${envelope('乙',true)}<small>乙的信 · 已封存</small></span></div><div class="duo-drawn-card ${phase==='flipping'?'is-flipping':''}">${cardBack('第'+C.sign(draft.signId).number+'张 · 卦意待启')}</div><p class="duo-draw-status" role="status">六爻已齐，心意待启</p>${actionButton(phase==='flipping'?'正在翻开卦意卡…':'翻开卦意卡，读懂彼此','duo:reveal',{disabled:phase==='flipping',arrow:true})}<p class="quiet">随机呈现三张卦意卡之一 · 作为对话启发</p></section>`);}
  function revealedCard(person,match){const other=person==='a'?'b':'a';return `<article class="duo-revealed-card panel ${person}"><span class="duo-person-label">${who(person)}的心意</span><small>实际最在意</small><h3>${C.label(draft.topicId,draft.answers[person].self)||'自由填写'}</h3><div class="duo-card-divider"></div><p>${who(other)}猜${who(person)}在意的是<br><strong>${C.label(draft.topicId,draft.answers[other].guess)||'自由填写'}</strong></p><span class="duo-match ${match===true?'yes':match===null?'pending':''}">${icon(match===true?'check':'info')}${match===null?'结合原话一起确认':match?'所选方向一致':'有一处理解偏差'}</span></article>`;}
  function writtenVoices(){const people=['a','b'].filter(p=>draft.answers[p].selfText?.trim()||draft.answers[p].guessText?.trim());if(!people.length)return '';return `<details class="duo-written-voices"><summary>展开信笺，读读完整的心意<span>双方写下的话 ${icon('next')}</span></summary><p>先读完对方的理由，再回应。</p>${people.map(p=>`<article class="panel"><h4>${who(p)}写下的话</h4><dl>${['self','guess'].filter(f=>draft.answers[p][f+'Text']?.trim()).map(f=>`<dt>${f==='self'?'我最在意什么':`我猜${p==='a'?'乙':'甲'}最在意什么`}</dt><dd>${html(draft.answers[p][f+'Text'])}</dd>`).join('')}</dl></article>`).join('')}</details>`;}
  function signCard(){const s=C.sign(draft.signId);return s?`<section class="duo-sign-card panel" data-sign="${s.id}"><div class="duo-sign-meta"><span>本次卦意 · 第${s.number}张</span><small>卦意启发卡</small></div><div class="duo-sign-title">${duoHex(s)}<div><h2>${s.name}</h2><p>${s.theme}</p></div></div><p class="duo-sign-meaning">${s.meaning}</p><blockquote>“${s.quote}”<cite>${s.source}</cite></blockquote></section>`:'';}
  function understanding(analysis){return `<section class="duo-understanding"><span class="eyebrow">读懂这次不同</span><h2>把在意与猜测，放在一起看</h2><p class="duo-analysis-summary">${analysis.summary}</p><div class="duo-needs">${analysis.priorities.map(p=>`<article><span>${p.person}的在意</span><strong>${html(p.custom?'自己写下的心意':p.label)}</strong><p>${html(p.custom?p.text:p.need)}</p></article>`).join('')}</div><div class="duo-directions">${analysis.directions.map(d=>`<article><h3>${d.from}对${d.to}的理解 <span>${d.match===true?'方向一致':d.match===false?'有一处偏差':'一起确认原话'}</span></h3><p>${d.match===null?`${d.guess?`${d.from}猜的是「${d.guess}」。`:''}${d.actual?`${d.to}选的是「${d.actual}」。`:''}其中一页使用了自由填写，请结合信中的原话确认具体需要，再判断哪里需要调整。`:d.match?`你猜到了「${d.actual}」这个方向。可以再问一句：“你希望我具体怎么做？”`:`${d.from}原先猜${d.to}在意「${d.guess}」，${d.to}实际选了「${d.actual}」。先听${d.to}解释这个需要，再调整原先的安排。`}</p></article>`).join('')}</div><p class="duo-analysis-source">依据所选方向整理分析与建议；文字中的细节，请结合原话一起确认。</p></section>`;}
  function advice(analysis){const s=C.sign(draft.signId);return `<section class="duo-advice"><span class="eyebrow">把分歧变成下一步</span><h2>这件事，可以这样解决</h2><ol>${analysis.steps.map((step,i)=>`<li><span>${i+1}</span><div><h3>${step.title}</h3><p>${html(step.body)}</p></div></li>`).join('')}</ol>${s?`<div class="duo-sign-action"><small>这一签，给对话的一个提醒 · ${s.word}</small><h3>${s.theme}</h3><p>${s.action}</p></div>`:''}<button class="text-button duo-use-plan" data-act="duo:use-plan">把第二步写进我们的约定 ${icon('arrow')}</button></section>`;}
  function result(){const compared=C.compare(draft.topicId,draft.answers),analysis=C.analyze(draft.topicId,draft.answers);if(!compared||!analysis){reset();return intro();}return shell(`<section class="duo-content duo-result"><span class="eyebrow">${draft.id?'共同记录回看':'卦意已启，心意相见'}</span><p class="duo-result-event">${html(draft.event||C.topic(draft.topicId).question)}</p>${signCard()}${understanding(analysis)}<div class="duo-revealed-grid">${revealedCard('a',compared.bToA)}${revealedCard('b',compared.aToB)}</div>${writtenVoices()}${advice(analysis)}<section class="duo-question panel"><span class="eyebrow">再一起回答这个问题</span><h3>${compared.question}</h3><p>轮流说说自己的理由，另一位先听完，再回应。</p></section><label for="duoAgreement" class="duo-label">留下一条共同约定 <small>可修改</small></label><textarea id="duoAgreement" maxlength="300" placeholder="我们先做哪一步？什么时候再一起聊聊？">${html(draft.agreement)}</textarea><label class="duo-save-consent"><input id="duoSaveConsent" type="checkbox" ${draft.consent?'checked':''}><span>双方同意将本次心意、卦意卡与约定保存在这台设备</span></label>${actionButton(draft.id?'更新共同记录':'保存这次换位','duo:save',{icon:'save',disabled:!draft.consent})}<button class="text-button view-records" data-act="viewRecords">查看我的记录</button><button class="duo-restart text-button" data-act="duo:restart">再体验一次</button><p class="quiet">建议供双方商量调整。保存后可在记录中回看或删除。</p></section>`);}
  function page(){return ({intro,first:()=>form('a'),handoff,second:()=>form('b'),ready,result}[draft.stage]||intro)();}
  function repaint(keep=false){render(keep);}
  function open(record){const valid=C.normalizeRecord(record);if(!valid)return;reset();draft={...draft,...valid,answers:{a:{...valid.answers.a},b:{...valid.answers.b}},stage:'result',consent:false,returnPage:'records',dirty:false};}
  function leave(){const destination=draft.returnPage||'home';reset();go(destination,false);}
  function exit(){if(draft.stage==='intro'||(draft.stage==='result'&&draft.id&&!draft.dirty))leave();else openModal('confirm',{title:'退出这次换位？',text:'未保存的双方心意和约定会被清除。已保存的记录不受影响。',action:'duo:exit',actionText:'退出并清除'});}
  function act(action,arg=''){
    switch(action){
      case 'enter':reset();return go('duo');
      case 'start':if(draft.stage!=='intro')return;draft.stage='first';return repaint();
      case 'choose':{if(!['first','second'].includes(draft.stage)||draft.sealing)return;const [field,value]=arg.split(':'),p=draft.stage==='first'?'a':'b';if(!['self','guess'].includes(field)||draft.sealed[p][field]||!C.topic(draft.topicId).options.some(o=>o.id===value))return;draft.answers[p][field]=value;repaint(true);document.querySelector(`[data-act="duo:choose"][data-arg="${arg}"]`)?.focus({preventScroll:true});return;}
      case 'clear':{const p=draft.stage==='first'?'a':'b';if(!['first','second'].includes(draft.stage)||draft.sealing||!['self','guess'].includes(arg)||draft.sealed[p][arg])return;draft.answers[p][arg]='';return repaint(true);}
      case 'seal':{const p=draft.stage==='first'?'a':draft.stage==='second'?'b':null;if(!p||draft.sealing||draft.sealed[p][arg]||!C.fieldComplete(draft.topicId,draft.answers[p],arg))return;document.activeElement?.blur();draft.sealing=arg;repaint(true);document.querySelector(`[data-letter="${arg}"]`)?.scrollIntoView({block:'center',behavior:moving()?'smooth':'auto'});later(1370,()=>{draft.sealed[p][arg]=true;draft.sealing='';repaint(true);const target=arg==='self'&&!draft.sealed[p].guess?document.querySelector('[data-letter="guess"] h2'):document.querySelector('[data-act="duo:submit"]');target?.scrollIntoView({block:'center',behavior:moving()?'smooth':'auto'});target?.focus({preventScroll:true});});return;}
      case 'submit':{const p=draft.stage==='first'?'a':draft.stage==='second'?'b':null;if(!p||draft.sealing||!draft.sealed[p].self||!draft.sealed[p].guess||!C.answerComplete(draft.topicId,draft.answers[p]))return;draft.stage=p==='a'?'handoff':'ready';return repaint();}
      case 'second':if(draft.stage!=='handoff')return;draft.stage='second';return repaint();
      case 'draw':{
        if(draft.stage!=='ready'||!['idle','casting'].includes(draft.drawPhase)||draft.castBusy||draft.castCount>=6||!C.validAnswers(draft.topicId,draft.answers))return;
        draft.castCount++;draft.castBusy=true;draft.drawPhase='casting';if(draft.castCount===6&&!draft.signId)draft.signId=C.drawSign();repaint(true);
        later(330,()=>{draft.castBusy=false;if(draft.castCount===6){draft.drawPhase='drawn';repaint();document.querySelector('[data-act="duo:reveal"]')?.focus({preventScroll:true});}else{repaint(true);document.querySelector('[data-act="duo:draw"]')?.focus({preventScroll:true});}});return;
      }
      case 'skip-cast':if(draft.stage!=='ready'||!['idle','casting'].includes(draft.drawPhase)||draft.castBusy||!C.validAnswers(draft.topicId,draft.answers))return;draft.castCount=6;draft.signId=draft.signId||C.drawSign();draft.drawPhase='drawn';repaint();document.querySelector('[data-act="duo:reveal"]')?.focus({preventScroll:true});return;
      case 'reveal':if(draft.stage!=='ready'||draft.drawPhase!=='drawn'||!C.sign(draft.signId))return;draft.drawPhase='flipping';repaint(true);later(400,()=>{draft.stage='result';repaint();});return;
      case 'use-plan':if(draft.stage!=='result')return;if(draft.agreement.trim())return toast('约定中已有内容，可以在下方继续修改');draft.agreement=C.analyze(draft.topicId,draft.answers).steps[1].body.slice(0,300);draft.dirty=true;repaint(true);document.getElementById('duoAgreement')?.scrollIntoView({block:'center'});return;
      case 'save':{if(draft.stage!=='result'||!draft.consent||!C.validAnswers(draft.topicId,draft.answers))return;const existing=records.find(r=>r.kind==='duo'&&r.id===draft.id);const value=C.normalizeRecord({...draft,kind:'duo',id:draft.id||newId(),createdAt:draft.createdAt||new Date().toISOString(),updatedAt:new Date().toISOString(),favorite:existing?.favorite||false});draft.id=value.id;draft.createdAt=value.createdAt;draft.dirty=false;const ok=persistRecords([value,...records.filter(r=>r.id!==value.id)]);repaint(true);if(ok)toast('已保存心意、卦意卡与共同约定');return;}
      case 'restart':return openModal('confirm',{title:'重新开始一次换位？',text:'当前未保存的内容会清除，已保存记录仍然保留。',action:'duo:reset',actionText:'重新开始'});
      case 'reset':closeModal(false);reset();return repaint();
      case 'exit':closeModal(false);return leave();
    }
  }
  document.addEventListener('input',e=>{
    if(pageIsDuo()&&['first','second'].includes(draft.stage)&&['selfText','guessText'].includes(e.target.dataset.duoField)){
      const person=draft.stage==='first'?'a':'b',field=e.target.dataset.duoField,question=field==='selfText'?'self':'guess';if(draft.sealing||draft.sealed[person][question])return;
      draft.answers[person][field]=e.target.value.slice(0,C.MAX_TEXT);const count=document.querySelector(`[data-count="${question}"]`);if(count)count.textContent=`${e.target.value.length}/${C.MAX_TEXT}`;const seal=document.querySelector(`[data-act="duo:seal"][data-arg="${question}"]`);if(seal)seal.disabled=!C.fieldComplete(draft.topicId,draft.answers[person],question);
    }
    if(pageIsDuo()&&e.target.id==='duoEvent'&&draft.stage==='intro')draft.event=e.target.value.slice(0,80);
    if(pageIsDuo()&&e.target.id==='duoAgreement'&&draft.stage==='result'){draft.agreement=e.target.value.slice(0,300);draft.dirty=true;}
  });
  document.addEventListener('change',e=>{if(!pageIsDuo())return;if(e.target.id==='duoTopic'&&draft.stage==='intro'&&C.topic(e.target.value)){draft.topicId=e.target.value;repaint(true);document.getElementById('duoTopic')?.focus({preventScroll:true});}if(e.target.id==='duoSaveConsent'&&draft.stage==='result'){draft.consent=e.target.checked;const button=document.querySelector('[data-act="duo:save"]');if(button)button.disabled=!draft.consent;}});
  function pageIsDuo(){return document.querySelector('#viewport')?.dataset.page==='duo';}
  window.addEventListener('pagehide',()=>{reset();if(pageIsDuo())document.querySelector('#viewport').replaceChildren();});
  window.addEventListener('pageshow',e=>{if(e.persisted&&pageIsDuo())render(false,false);});
  return Object.freeze({entry,page,act,exit,reset,open});
})();

/* Page composition follows the approved artboards. No page is a bitmap hotspot. */
function homePage() {
  return `<div class="native-page home-page">${statusBar()}<header class="home-heading"><h1>生活易测</h1><p>在日常的选择里<br>听见更清晰的自己</p>${layer('gold.png','home-gold')}<button class="icon-button home-settings" data-act="go:settings" aria-label="设置">${icon('settings')}</button></header>${layer('home-scene.webp','home-scene')}<div class="home-cta">${actionButton('开始体验','go:scenario',{arrow:true})}</div>${Duo.entry()}<button class="daily-quote panel" data-act="article" data-arg="xiaoxu"><span class="gold-dot"></span><strong>今日小语</strong><p>风会记得每一朵花的方向，<br>你也会走向更清晰的自己。</p>${layer('quote-flower.png','quote-art')}${icon('next')}</button><div class="home-shortcuts">${[0,1].map(i=>`<button class="scenario-shortcut panel" data-act="quick" data-arg="${i}">${layer(SCENARIOS[i].art)}<span><strong>${cases[i]}</strong><small>${SCENARIOS[i].sub}</small></span>${icon('next')}</button>`).join('')}</div></div>`;
}
function loginPage() {
  return `<div class="native-page login-page">${statusBar()}${layer('login-corner.png','login-corner')}<header class="login-heading"><h1>生活易测</h1><p class="login-style">青瓷紫雾</p><p>在日常的选择里，<br>听见更清晰的自己</p></header>${layer('login-scene.webp','login-scene')}<form id="loginForm" class="login-form" novalidate><label class="login-field panel">${icon('phone')}<span class="sr-only">手机号</span><input id="phone" name="phone" type="tel" autocomplete="tel" inputmode="numeric" maxlength="11" placeholder="手机号" value="${html(loginDraft.phone)}"></label><label class="login-field panel">${icon('shield')}<span class="sr-only">验证码</span><input id="code" name="code" autocomplete="one-time-code" inputmode="numeric" maxlength="6" placeholder="验证码" value="${html(loginDraft.code)}"><button type="button" class="code-button" data-act="code">体验验证码</button></label><div class="consent"><label><input id="accept" type="checkbox" ${loginDraft.consent?'checked':''}><span>我已阅读并同意</span></label><button type="button" data-act="terms">用户协议</button><span>与</span><button type="button" data-act="privacy">隐私说明</button></div><button class="button" type="submit"><span>登录并进入</span>${icon('arrow')}</button>${actionButton('游客体验','guest',{secondary:true})}<p class="quiet">本地演示登录 · 验证码 123456 · 不发送短信</p></form>${layer('login-footer.webp','login-footer')}</div>`;
}
function scenarioPage() {
  return `<div class="native-page scenario-page">${statusBar()}${topBar('')}<header class="scenario-heading"><h1>选择你想体验的情境</h1><p>专注当下的问题，换个角度整理想法</p></header><div class="scenario-choices" role="group" aria-label="生活情境">${SCENARIOS.map((s,i)=>`<button class="scenario-choice panel ${i===4?'wide':''} ${scenario===cases[i]?'is-selected':''}" data-act="choose" data-arg="${i}" aria-pressed="${scenario===cases[i]}">${layer(s.art)}<span class="scenario-copy"><strong>${cases[i]}</strong><small>${s.sub}</small></span><span class="choice-check">${icon('check')}</span></button>`).join('')}</div><div class="scenario-actions">${actionButton('下一步','start',{arrow:true})}<button class="text-button" data-act="skipScenario">直接体验</button></div>${layer('deck-footer.webp','scenario-footer')}</div>`;

function castProgress() {

  if(modal.kind==='delete'){content='<h2 id="sheet-title">删除这条记录？</h2><p>这条记录中的选择、想法或双方约定会一并删除，删除后无法恢复。</p>';buttons=actionButton('取消','close',{secondary:true})+actionButton('确认删除','confirmDelete',{arg:modal.id});}
  if(modal.kind==='search'){content='<h2 id="sheet-title">搜索文化内容</h2><form id="searchForm" class="search-form"><label class="sr-only" for="searchBox">搜索关键词</label><input id="searchBox" type="search" placeholder="搜索卦象、文章或关键词" autocomplete="off"><button type="submit" class="button">搜索</button></form><div id="searchResults" class="search-results" aria-live="polite"><p class="quiet">输入关键词，搜索本地文化文章</p></div>';}
  if(modal.kind==='share'){content=`<h2 id="sheet-title">分享这次思考</h2><p>可复制下方摘要。摘要不包含你写下的私人想法。</p><textarea class="share-text" readonly aria-label="分享摘要">${html(modal.text)}</textarea>`;buttons=actionButton('复制摘要','copyShare');}
  if(!buttons)buttons=actionButton('关闭','close',{secondary:true});
  $('viewport').inert=true;$('globalNav').inert=true;
  $('modal').innerHTML=`<div class="backdrop" data-act="close"><section class="sheet" role="dialog" aria-modal="true" aria-labelledby="sheet-title" tabindex="-1"><div class="grab" aria-hidden="true"></div><button class="sheet-close" data-act="close" aria-label="关闭弹窗">${icon('close')}</button>${content}<div class="buttons">${buttons}</div></section></div>`;
  requestAnimationFrame(()=>($('searchBox')||document.querySelector('.sheet-close'))?.focus());
}
function search(){
  const q=$('searchBox')?.value.trim().toLowerCase()||'';
  const found=q?ARTICLES.filter(a=>(a.title+a.subtitle+a.sections.map(s=>s.title+s.text).join('')).toLowerCase().includes(q)):[];
  $('searchResults').innerHTML=found.length?found.map(articleItem).join(''):`<div class="empty-search">${q?'没有找到相关内容，试试“小畜”或“生活”。':'请输入想查找的关键词。'}</div>`;
}
async function share(text){
  if(navigator.share){try{await navigator.share({title:'生活易测',text});return;}catch(e){if(e.name==='AbortError')return;}}
  openModal('share',{text});
}
function act(kind,arg=''){
  if(kind.startsWith('duo:'))return Duo.act(kind.slice(4),arg);
  if(kind.startsWith('go:'))return go(kind.slice(3));
  switch(kind){
    case 'nav':{routeStack=[];if(arg==='favorites'){recordTab=1;go('records',false);}else if(arg==='records'){recordTab=0;go('records',false);}else go(arg,false);return;}
    case 'back':return back();case 'guest':sessionMode='guest';return go('home',false);
    case 'code':loginDraft.code='123456';$('code').value='123456';return toast('本地体验验证码：123456，不发送短信');
    case 'login':{const p=loginDraft.phone,c=loginDraft.code;if(!/^1\d{10}$/.test(p))return toast('请输入11位手机号');if(c!=='123456')return toast('请输入体验验证码 123456');if(!loginDraft.consent)return toast('请先阅读并勾选用户协议');sessionMode='local';return go('home',false);}
    case 'choose':scenario=cases[+arg]||cases[0];render(true);document.querySelector(`[data-act="choose"][data-arg="${arg}"]`)?.focus({preventScroll:true});return;
    case 'quick':scenario=cases[+arg]||cases[0];return begin();case 'start':return begin();case 'skipScenario':scenario='日常生活';return begin();
    case 'cast':return cast();case 'finish':clearTimeout(castTimer);casts=6;return go('result');case 'draw':return begin();
    case 'resultTab':selectedTab=Math.max(0,Math.min(3,+arg));render(true);document.querySelector(`[data-act="resultTab"][data-arg="${selectedTab}"]`)?.focus({preventScroll:true});return;
    case 'classic':classicOpen=!classicOpen;return render(true);
    case 'randomCard':return changeCard(YijingCore.randomIndex(eventIndex,cards.length));
    case 'prevCard':return changeCard((eventIndex+cards.length-1)%cards.length);
    case 'nextCard':return changeCard((eventIndex+1)%cards.length);
    case 'selectCard':if(Number.isInteger(+arg)&&+arg>=0&&+arg<cards.length)changeCard(+arg);return;
    case 'save':return save();case 'favorite':return favorite();
    case 'share':return share(`生活易测 · 风天小畜（模拟文化体验）\n情境：${scenario}\n变数卡：${cards[eventIndex].title}\n${cards[eventIndex].idea}`);
    case 'shareArticle':{const a=ARTICLES.find(a=>a.id===articleId);return share(`生活易测 · 文化阅读\n${a.title}\n${a.subtitle}`);}
    case 'copyShare':{const text=modal?.text||'';if(navigator.clipboard?.writeText)navigator.clipboard.writeText(text).then(()=>toast('分享摘要已复制')).catch(()=>{document.querySelector('.share-text')?.select();toast('请长按摘要复制');});else{document.querySelector('.share-text')?.select();toast('请长按摘要复制');}return;}
    case 'recordTab':recordTab=+arg===1?1:0;render(true);document.querySelector(`[data-act="recordTab"][data-arg="${recordTab}"]`)?.focus({preventScroll:true});return;
    case 'openRecord':return openRecord(arg);
    case 'recordFavorite':{const item=records.find(r=>r.id===arg);if(item){persistRecords(records.map(r=>r.id===arg?{...r,favorite:!r.favorite}:r));render(true);}return;}
    case 'deleteRecord':return openModal('delete',{id:arg});
    case 'confirmDelete':{persistRecords(records.filter(r=>r.id!==arg));if(currentRecord?.id===arg)currentRecord=null;closeModal();render(true);return;}
    case 'viewRecords':recordTab=0;return go('records',false);case 'viewFavorites':recordTab=1;return go('records',false);
    case 'category':category=CATEGORIES.some(c=>c.id===arg)?arg:'all';return render(true);
    case 'article':if(!ARTICLES.some(a=>a.id===arg))return;articleId=arg;return go('article');
    case 'search':return openModal('search');case 'doSearch':return search();
    case 'toggleMotion':motion=!motion;persistPreferences();return render(true);
    case 'toggleNotify':notify=!notify;persistPreferences();render(true);return toast(notify?'已保存演示偏好，不会发送系统通知':'已关闭通知演示偏好');
    case 'terms':return openModal('message',{title:'用户协议 · 本地演示',text:'生活易测是周易文化与生活情境互动演示。无需真实账号，手机号仅用于当前页面校验，不会发送短信或上传。六次摇卦展示固定示例，变数卡为现代创作，选择始终由你自己作出。'});
    case 'privacy':return openModal('message',{title:'隐私说明',text:'记录、收藏和设置仅保存在当前浏览器的本地存储中，不会上传。手机号和验证码不写入本地存储。清理浏览器数据会清除这些记录。分享摘要不包含你的私人想法。'});
    case 'about':return openModal('message',{title:'关于生活易测',text:'青瓷紫雾，以周易文化为素材的生活情境互动 Demo。沿用原有纸艺花卉、山水与人物美术。当前为固定示例卦、本地登录和本地数据体验，不提供真实短信、系统通知或未来预测。'});
    case 'close':return closeModal();
  }
}
document.addEventListener('click',e=>{const target=e.target.closest('[data-act]');if(!target)return;if(target.classList.contains('backdrop')&&e.target.closest('.sheet'))return;e.preventDefault();act(target.dataset.act,target.dataset.arg||'');});
document.addEventListener('submit',e=>{if(e.target.id==='loginForm'){e.preventDefault();act('login');}if(e.target.id==='searchForm'){e.preventDefault();search();}});
document.addEventListener('input',e=>{if(e.target.id==='thought'){thoughtDraft=e.target.value;window._thought=thoughtDraft;}if(e.target.id==='phone')loginDraft.phone=e.target.value;if(e.target.id==='code')loginDraft.code=e.target.value;});
document.addEventListener('change',e=>{if(e.target.id==='accept')loginDraft.consent=e.target.checked;});
document.addEventListener('keydown',e=>{
  if(e.key==='Escape'){e.preventDefault();back();return;}
  if(modal&&e.key==='Tab'){const els=[...document.querySelectorAll('.sheet button,.sheet input,.sheet textarea')].filter(x=>!x.disabled);const first=els[0],last=els.at(-1);if(e.shiftKey&&document.activeElement===first){e.preventDefault();last?.focus();}else if(!e.shiftKey&&document.activeElement===last){e.preventDefault();first?.focus();}return;}
  if(e.target.matches('[role="tab"]')&&['ArrowLeft','ArrowRight','Home','End'].includes(e.key)){e.preventDefault();const isResult=e.target.dataset.act==='resultTab';const count=isResult?4:2;const current=isResult?selectedTab:recordTab;const next=e.key==='Home'?0:e.key==='End'?count-1:(current+(e.key==='ArrowRight'?1:-1)+count)%count;act(isResult?'resultTab':'recordTab',String(next));}
});
reducedQuery.addEventListener('change',e=>{reducedMotion=e.matches;render(true);});
window.addEventListener('pagehide',()=>{clearTimeout(castTimer);});
const initial=location.hash.slice(1);if(initial==='favorites'){page='records';recordTab=1;}else if(VALID_PAGES.includes(initial))page=initial;
if(window.history.state?.yijing&&window.history.state.route?.page===page){routeStack=window.history.state.parents||[];restoreRoute(window.history.state.route);}else render();
writeRoute(false);
if(storageWarning)setTimeout(()=>toast(storageWarning),200);

</script></body>
</html>
